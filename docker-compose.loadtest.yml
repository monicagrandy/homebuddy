services:
  locust:
    build:
      context: .
      dockerfile: loadtests/Dockerfile
    depends_on:
      backend:
        condition: service_started
    environment:
      HOMEBUDDY_LOADTEST_USERS_FILE: /loadtests/users.json
      HOMEBUDDY_LOADTEST_PROMPTS_FILE: /loadtests/prompts.json
      HOMEBUDDY_MAX_FAILURE_RATIO: ${HOMEBUDDY_MAX_FAILURE_RATIO:-0.01}
      HOMEBUDDY_P95_MS: ${HOMEBUDDY_P95_MS:-15000}
      HOMEBUDDY_LOADTEST_TIMEOUT_SECONDS: ${HOMEBUDDY_LOADTEST_TIMEOUT_SECONDS:-180}
    volumes:
      - ./loadtests:/loadtests
